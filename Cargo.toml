[package]
name = "saisonnier"
version = "0.1.0"
edition = "2024"
description = "Passerelle TCP <-> WebSocket pilotée par workflows"

[dependencies]
anyhow = "1.0.104"
futures-util = { version = "0.3.34", features = ["sink"] }
jsonschema = { version = "0.60.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true
